rules:
  - id: odozi-pii-leakage
    patterns:
      - pattern-either:
          - pattern: logger.info(..., $VAR, ...)
          - pattern: print(..., $VAR, ...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|secret|token|email|ssn).*
    message: "Potential PII Leak: Variable $VAR might contain sensitive data and should not be logged."
    languages: [python]
    severity: WARNING
